<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人数字名片</title>
    <style>
        /* CSS 样式：负责控制名片的长相与排版 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 360px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 32px 24px;
            text-align: center;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 16px;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .name {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .title {
            font-size: 14px;
            color: #666666;
            margin-bottom: 16px;
        }

        .bio {
            font-size: 13px;
            color: #888888;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            background-color: #f0f3f6;
            color: #333333;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        /* 鼠标悬停时的动态效果 */
        .btn:hover {
            background-color: #007aff;
            color: #ffffff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- HTML 结构：负责名片的内容 -->
    <div class="card">
        <!-- 替换你的头像图片网址，若没有可先保留预设图片 -->
        <img class="avatar" src="https://i.postimg.cc/Px1Xb82t/UU.jpg" alt="个人头像">
        
        <h1 class="name">陳安楀</h1>
        <p class="title">我是屏東人
        <p class="bio">热爱排球、聽音樂</p>

        <div class="links">
            <a href="https://behance.net" target="_blank" class="btn">LINE</a>
            <a href="https://instagram.com" target="_blank" class="btn">📷 Instagram</a>
            <a href="mailto:your-email@example.com" class="btn">✉️ 联系我</a>
        </div>
    </div>

</body>
</html>
